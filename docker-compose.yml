services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: todouser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: todolist
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_USER: todouser
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: todolist
      PORT: 3000
    depends_on:
      - db
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./public:/usr/share/nginx/html
      - ./deploy/nginx-todolist.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: