version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: todolist_db
    restart: always
    environment:
      POSTGRES_DB: todolist_db
      POSTGRES_USER: todolist_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - todolist_net

  app:
    build: ./backend
    container_name: todolist_app
    restart: always
    environment:
      DB_USER: todolist_user
      DB_HOST: db
      DB_NAME: todolist_db
      DB_PASSWORD: ${DB_PASSWORD}
      DB_PORT: 5432
      PORT: 3000
    depends_on:
      - db
    networks:
      - todolist_net

  nginx:
    image: nginx:alpine
    container_name: todolist_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./public:/usr/share/nginx/html
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - todolist_net

volumes:
  postgres_data:

networks:
  todolist_net:
    driver: bridge